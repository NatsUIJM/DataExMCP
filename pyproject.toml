[project]
name = "kntagrag"
version = "0.1.0"
description = "Tag-based knowledge retrieval MCP server"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openai",
    "mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kntagrag = "kntagrag:main"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["."]
